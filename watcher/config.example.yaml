interval: 10s
healthAddr: ":8080"
repoDir: /root/slo-rollout-demo
reportDir: /root/slo-rollout-demo/docs/release-reports
stateFile: /root/slo-rollout-demo/docs/release-reports/go-rollout-watcher-state.json
evidenceStoreDB: /tmp/s-sentinel-evidence-store/portal-evidence-store.db
incidentStoreDB: /tmp/s-sentinel-incident-store/incidents.db
operationStoreDB: /tmp/s-sentinel-operation-store/operations.db
evidenceStoreScriptFile: /root/slo-rollout-demo/scripts/evidence-store.py
evidenceStorePython: python3
evidenceStoreRefreshStateFile: /tmp/s-sentinel-evidence-store/portal-evidence-store-refresh.json
ollamaUrl: http://127.0.0.1:11434
model: qwen2.5:0.5b
prometheusUrl: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
incidentReleaseFreshnessWindow: 1h
reliabilityControllerEnabled: true
reliabilityReconcileInterval: 30s
reliabilityReconcileConcurrency: 4

targets:
  - namespace: slo-rollout
    rollout: demo-app

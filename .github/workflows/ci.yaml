name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: watcher/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Backend tests
        working-directory: watcher
        run: go test ./...
      - name: Frontend build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Schema JSON syntax
        run: |
          for schema in schemas/*.schema.json; do python3 -m json.tool "$schema" > /dev/null; done
      - name: Release contract fixtures
        run: bash scripts/test-release-contracts.sh
